spring:
    application:
        name: taskflow

    datasource:
        url: jdbc:postgresql://localhost:5432/taskflow
        username: taskflow
        password: taskflow

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true

app:
    jwt:
        secret: ${SECRET:my-super-secret-key-for-taskflow-management-jwt-2026}
        expiration: ${JWT_EXPIRATION:86400000}

    cors:
        allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
    level:
        org.springframework.security: INFO